name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -project Launcher.xcodeproj \
            -scheme Launcher \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build

          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/Launcher.app" Payload/
          zip -qr Launcher-unsigned.ipa Payload
          mkdir -p output
          mv Launcher-unsigned.ipa output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-unsigned-ipa
          path: output/Launcher-unsigned.ipa
