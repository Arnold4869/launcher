name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          # 每次 commit 自动递增: 1.0.<commit 数>, build 号 = run 号
          COMMITS=$(git rev-list --count HEAD)
          echo "marketing=1.0.${COMMITS}" >> $GITHUB_OUTPUT
          echo "build=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "Version: 1.0.${COMMITS} (build ${GITHUB_RUN_NUMBER})"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -project Launcher.xcodeproj \
            -scheme Launcher \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build

          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/Launcher.app" Payload/

          # 直接写版本号进 Info.plist（xcodegen 的 plist 是字面量，命令行覆盖无效）
          VER=${{ steps.ver.outputs.marketing }}
          BUILD=${{ steps.ver.outputs.build }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" Payload/Launcher.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Payload/Launcher.app/Info.plist
          echo "Packed version: $VER ($BUILD)"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/Launcher.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/Launcher.app/Info.plist

          zip -qr Launcher-unsigned.ipa Payload
          mkdir -p output
          mv Launcher-unsigned.ipa "output/Launcher-${VER}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-unsigned-ipa
          path: output/*.ipa
